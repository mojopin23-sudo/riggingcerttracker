# fly.toml app configuration file generated for riggingcerttracker on 2026-11-03T17:46:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'riggingcerttracker'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_USER = 'terminal'
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'certs_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/login'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
